<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="34%" r="85%">
      <stop offset="0%"  stop-color="#161c3a"/>
      <stop offset="55%" stop-color="#0d1226"/>
      <stop offset="100%" stop-color="#060814"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="52%">
      <stop offset="0%"  stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0.12" y1="1" x2="0.72" y2="0">
      <stop offset="0%"  stop-color="#7c5cff"/>
      <stop offset="55%" stop-color="#4f7dff"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#3a4468" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1b2340" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- squircle app-icon base -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glow)"/>
  <rect x="7" y="7" width="498" height="498" rx="109" fill="none"
        stroke="url(#rim)" stroke-width="2.5"/>

  <!-- hand landmark skeleton (MediaPipe-style tracking points) -->
  <g filter="url(#soft)">
    <g stroke="url(#stroke)" stroke-width="10" stroke-linecap="round"
       stroke-linejoin="round" fill="none">
      <!-- palm web -->
      <path d="M256 432 L185 391"/>
      <path d="M256 432 L205 300"/>
      <path d="M256 432 L250 289"/>
      <path d="M256 432 L295 300"/>
      <path d="M256 432 L335 321"/>
      <path d="M185 391 L205 300 L250 289 L295 300 L335 321"/>
      <!-- thumb -->
      <path d="M185 391 L150 351 L125 316 L104 285"/>
      <!-- index -->
      <path d="M205 300 L195 244 L188 199 L182 158"/>
      <!-- middle -->
      <path d="M250 289 L248 224 L247 171 L246 123"/>
      <!-- ring -->
      <path d="M295 300 L302 239 L307 191 L311 148"/>
      <!-- pinky -->
      <path d="M335 321 L352 272 L363 234 L372 199"/>
    </g>

    <!-- joint landmarks -->
    <g fill="#0d1226" stroke="url(#stroke)" stroke-width="4.5">
      <circle cx="185" cy="391" r="10"/>
      <circle cx="205" cy="300" r="10"/>
      <circle cx="250" cy="289" r="10"/>
      <circle cx="295" cy="300" r="10"/>
      <circle cx="335" cy="321" r="10"/>
      <circle cx="150" cy="351" r="8"/>
      <circle cx="125" cy="316" r="8"/>
      <circle cx="195" cy="244" r="8"/>
      <circle cx="248" cy="224" r="8"/>
      <circle cx="302" cy="239" r="8"/>
      <circle cx="352" cy="272" r="8"/>
    </g>

    <!-- wrist anchor -->
    <circle cx="256" cy="432" r="14" fill="#0d1226" stroke="#7c5cff" stroke-width="5"/>

    <!-- fingertip landmarks -->
    <g fill="#eafcff" stroke="#22d3ee" stroke-width="3">
      <circle cx="104" cy="285" r="9"/>
      <circle cx="246" cy="123" r="9"/>
      <circle cx="311" cy="148" r="9"/>
      <circle cx="372" cy="199" r="9"/>
    </g>

    <!-- active cursor target on index fingertip -->
    <circle cx="182" cy="158" r="28" fill="none" stroke="#22d3ee"
            stroke-width="6" stroke-dasharray="10 9" opacity="0.9"/>
    <circle cx="182" cy="158" r="10" fill="#22d3ee"/>
  </g>
</svg>
